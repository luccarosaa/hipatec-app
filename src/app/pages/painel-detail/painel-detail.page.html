<app-navbar></app-navbar>

<ion-content [fullscreen]="true">
<main class="app-page painel-detail-page" *ngIf="item; else notFound">
  <button class="back-link back-with-icon" type="button" (click)="voltar()">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
    Voltar
  </button>

  <section class="detail-shell content-card">
    <div class="detail-main">
      <span class="eyebrow">{{ item.label }}</span>
      <h1>{{ item.title }}</h1>
      <p class="lead">{{ item.description }}</p>
      <p>{{ item.detail }}</p>

      <div class="tags">
        <span *ngFor="let tag of item.tags">{{ tag }}</span>
      </div>

      <div class="detail-actions">
        <button type="button" *ngIf="item.kind !== 'guia'" [class.secondary]="isInscrito" (click)="alternarInscricao()">{{ actionLabel }}</button>
        <span *ngIf="feedback">{{ feedback }}</span>
      </div>
    </div>

    <aside class="detail-aside">
      <h2>Informações</h2>
      <dl>
        <div *ngFor="let info of item.info">
          <dt>{{ info.label }}</dt>
          <dd>{{ info.value }}</dd>
        </div>
      </dl>
    </aside>
  </section>
</main>

<ng-template #notFound>
  <main class="app-page">
    <section class="empty-state standalone content-card">
      <h1>Conteúdo não encontrado.</h1>
      <p>Volte ao painel para escolher uma mentoria, oficina, guia ou trilha disponível.</p>
      <button class="back-with-icon" type="button" (click)="voltar()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
        Voltar
      </button>
    </section>
  </main>
</ng-template>

<app-footer [compact]="true"></app-footer>
</ion-content>
